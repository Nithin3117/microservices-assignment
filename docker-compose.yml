services:

  nats:
    image: nats:latest
    command: "-js"
    ports:
      - "4222:4222"
      - "8222:8222"

  user-service:
    build: ./user-service
    ports:
      - "8001:8001"
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats

  notification-service:
    build: ./notification-service
    ports:
      - "8002:8002"
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      USER_SERVICE_URL: http://user-service:8001
      NOTIFICATION_SERVICE_URL: http://notification-service:8002
    depends_on:
      - user-service
      - notification-service